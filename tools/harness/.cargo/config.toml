# The harness is built as a static binary for each Treadmill host architecture
# (see `build::HOST_TARGETS`). rustc ships musl's C runtime for these targets,
# so its bundled `rust-lld` links them without any system cross toolchain.

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
