# This workflow runs the tests of the QEMU boards with tools/ci/integration-test, which
# builds their Tock kernels and libtock-c apps, writes them to flash files with
# tockloader, runs the boards inside QEMU, and checks their console output and
# screen.

name: qemu-virt-ci
env:
  TERM: xterm

on:
  push:
    branches-ignore:
    - "gh-readonly-queue/**"
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  qemu-virt-ci:
    runs-on: ubuntu-latest
    container:
      # Need a version of debian that has (at least) GCC 15 for
      # RISCV-64 support in libtock-c.
      image: debian:forky-slim

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl git make build-essential gcc-riscv64-unknown-elf qemu-system-riscv python3-pip pipx bash wget file unzip xvfb

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Checkout the current repository
        uses: actions/checkout@v7

      - name: Install elf2tab
        run: cargo install elf2tab

      # Install tockloader from a branch until a release supports the flash file
      # of a `hifive1b`.
      - name: Install tockloader
        shell: bash
        run: |
          pipx install git+https://github.com/tock/tockloader@dev/hifive1-flash-file
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Checkout libtock-c
        uses: actions/checkout@v7
        with:
          repository: tock/libtock-c
          path: libtock-c

      - name: Start virtual framebuffer
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Run the QEMU board tests
        shell: bash
        # libtock-c is checked out inside the tock workspace in CI (GitHub
        # Actions requires checkouts to be under the workspace root).
        run: make ci-job-qemu-virt QEMU_VIRT_ARGS="--libtock-c libtock-c"

      # Upload the console logs and screens, such that the screens can be
      # inspected and their hashes recorded.
      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-virt-logs
          path: qemu-virt-out/logs
